[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-identity-engine"
version = "0.1.0"
description = "Local-first personalized handwriting analysis, dataset curation, and synthesis research workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HIE contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
training = ["torch>=2.2", "torchvision>=0.17"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hie-server = "hie.cli:serve"
hie-train = "hie.training.train:main"

[tool.setuptools.packages.find]
include = ["hie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
